name: Chronicles-78 video converter

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      max_files:
        description: "Maximum videos to convert in this test run"
        required: false
        default: "4"

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARCHIVE_ROOT_FOLDER_ID: 1Ehj86Cf1N1trX0r-MMFPSjwqpgWtODus
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      MAX_FILES: ${{ inputs.max_files || '4' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Google Drive secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET GOOGLE_DRIVE_REFRESH_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $v"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install FFmpeg and Python dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check --quiet requests
          ffmpeg -version | head -n 1

      - name: Convert Drive videos to normalized MP4
        shell: bash
        run: |
          set -euo pipefail
          python scripts/video_convert_drive.py
