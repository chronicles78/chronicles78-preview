name: CH78 MAX server checks
on:
  pull_request:
    paths:
      - 'supabase/functions/ch78-max-*/**'
      - 'supabase/migrations/*ch78_max_*.sql'
      - 'supabase/config.toml'
      - 'tests/ch78-max*'
      - 'keeper/**'
      - 'tests/ch78-max-db/**'
      - 'tools/ask-keeper/**'
      - 'ops/ch78-max-*.sql'
      - '.github/workflows/ch78-max-ingest-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check keeper/app.mjs
      - run: python3 -B -m unittest discover -s tools/ask-keeper -p 'test_client.py'
      - run: node --test tests/ch78-max-*.test.mjs
      - run: npm ci --ignore-scripts --prefix tests/ch78-max-db
      - run: npm test --prefix tests/ch78-max-db
      - run: npm exec --yes --package=deno@2.5.4 -- deno check supabase/functions/ch78-max-webhook/index.ts supabase/functions/ch78-max-assistant/index.ts supabase/functions/ch78-max-worker/index.ts supabase/functions/ch78-max-miniapp/index.ts
